<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الطلبات</title><link rel="stylesheet" href="/assets/app.css"></head><body><div class="shell"><div id="nav"></div><main class="content"><div class="topbar"><div class="title"><h1>الطلبات</h1><p>كل Order مستقل ومربوط بالكابتن وكشف حسابه</p></div><button class="btn primary" onclick="openModal()">+ إضافة Order</button></div><div class="card"><div class="notice">عند حفظ Order يتم تسجيل ربحه واستهلاكه وعمولته تلقائياً في كشف حساب الكابتن.</div><div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>الرقم</th><th>الكابتن</th><th>العميل</th><th>القيمة</th><th>الربح</th><th>العمولة</th><th>الاستهلاك</th><th>الحالة</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">لا يوجد عرض مركزي للطلبات في هذه النسخة؛ استخدم حساب الكابتن لعرض الطلبات.</td></tr></tbody></table></div></div></main></div><div class="modal" id="modal"><div class="modal-box"><h2>إضافة Order</h2><form class="form" onsubmit="save(event)"><div class="field"><label>الكابتن</label><select id="captain" required></select></div><div class="row"><div class="field"><label>اسم العميل</label><input id="customer"></div><div class="field"><label>قيمة Order</label><input id="value" type="number" step="0.001" min="0" value="0"></div></div><div class="row"><div class="field"><label>ربح Order</label><input id="profit" type="number" step="0.001" min="0" value="1"></div><div class="field"><label>العمولة</label><input id="commission" type="number" step="0.001" min="0" value="0"></div></div><div class="field"><label>الاستهلاك</label><input id="consumption" type="number" step="0.001" min="0" value="0"></div><div class="field"><label>ملاحظة</label><textarea id="note"></textarea></div><div class="actions"><button class="btn primary">حفظ</button><button type="button" class="btn" onclick="modal.classList.remove('open')">إلغاء</button></div></form></div></div><script src="/admin/_layout.js"></script><script>fetch('/admin/_nav.html').then(r=>r.text()).then(x=>nav.innerHTML=x);async function openModal(){const d=await api('/api/admin/captains');captain.innerHTML=d.captains.filter(x=>x.status==='active').map(x=>`<option value="${x.id}">${x.name} — ${x.phone}</option>`).join('');modal.classList.add('open')}async function save(e){e.preventDefault();try{await api('/api/admin/orders',{method:'POST',body:JSON.stringify({captain_id:captain.value,customer_name:customer.value,value:value.value,production_profit:profit.value,commission:commission.value,consumption:consumption.value,note:note.value})});modal.classList.remove('open');alert('تم حفظ الـOrder وربطه بالحساب')}catch(e){alert(e.message)}}</script></body></html>
