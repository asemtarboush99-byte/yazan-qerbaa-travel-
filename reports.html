<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقارير</title><link rel="stylesheet" href="/assets/app.css"></head><body><div class="shell"><div id="nav"></div><main class="content"><div class="topbar"><div class="title"><h1>التقارير</h1><p>الإنتاج والتكاليف والمدفوعات حسب التاريخ</p></div></div><div class="card"><div class="row"><div class="field"><label>من</label><input id="from" type="date"></div><div class="field"><label>إلى</label><input id="to" type="date"></div></div><button class="btn primary" style="margin-top:12px" onclick="load()">عرض التقرير</button></div><div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><thead><tr><th>اليوم</th><th>الإنتاج</th><th>التكاليف</th><th>المدفوعات</th><th>الصافي قبل الدفع</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><script src="/admin/_layout.js"></script><script>fetch('/admin/_nav.html').then(r=>r.text()).then(x=>nav.innerHTML=x);const d=new Date();to.value=d.toISOString().slice(0,10);from.value=new Date(Date.now()-30*864e5).toISOString().slice(0,10);async function load(){const x=await api('/api/admin/reports?from='+from.value+'&to='+to.value);rows.innerHTML=x.rows.map(r=>`<tr><td>${r.day}</td><td class="positive">${money(r.production)}</td><td class="negative">${money(r.costs)}</td><td>${money(r.payments)}</td><td class="gold">${money(Number(r.production)-Number(r.costs))}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا يوجد بيانات</td></tr>')}load()</script></body></html>
