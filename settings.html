<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإعدادات</title><link rel="stylesheet" href="/assets/app.css"></head><body><div class="shell"><div id="nav"></div><main class="content"><div class="topbar"><div class="title"><h1>إعدادات الأسعار</h1><p>القيم الافتراضية التي تستخدم في الحسابات</p></div></div><div class="card"><form class="form" onsubmit="save(event)"><div class="row"><div class="field"><label>إنتاج الراكب</label><input id="passenger_production" type="number" step="0.001"></div><div class="field"><label>استهلاك الراكب</label><input id="passenger_consumption" type="number" step="0.001"></div></div><div class="row"><div class="field"><label>إنتاج Order</label><input id="order_production" type="number" step="0.001"></div><div class="field"><label>استهلاك Order</label><input id="order_consumption" type="number" step="0.001"></div></div><div class="field"><label>أرضية الجروب</label><input id="group_floor" type="number" step="0.001"></div><button class="btn primary">حفظ الإعدادات</button></form></div></main></div><script src="/admin/_layout.js"></script><script>fetch('/admin/_nav.html').then(r=>r.text()).then(x=>nav.innerHTML=x);api('/api/admin/settings').then(s=>Object.keys(s).forEach(k=>{if(document.getElementById(k))document.getElementById(k).value=s[k]}));async function save(e){e.preventDefault();const b={};['passenger_production','passenger_consumption','order_production','order_consumption','group_floor'].forEach(k=>b[k]=document.getElementById(k).value);try{await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(b)});alert('تم الحفظ')}catch(e){alert(e.message)}}</script></body></html>
