<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المدفوعات</title><link rel="stylesheet" href="/assets/app.css"></head><body><div class="shell"><div id="nav"></div><main class="content"><div class="topbar"><div class="title"><h1>المدفوعات</h1><p>تسجيل ما تم دفعه وخصمه من المستحقات</p></div></div><div class="card"><form class="form" onsubmit="save(event)"><div class="row"><div class="field"><label>الكابتن</label><select id="captain" required></select></div><div class="field"><label>المبلغ</label><input id="amount" type="number" step="0.001" min="0.001" required></div></div><div class="row"><div class="field"><label>طريقة الدفع</label><select id="method"><option>cash</option><option>bank</option><option>wallet</option><option>whatsapp</option></select></div><div class="field"><label>ملاحظة</label><input id="note"></div></div><button class="btn primary">تسجيل الدفعة</button></form></div></main></div><script src="/admin/_layout.js"></script><script>fetch('/admin/_nav.html').then(r=>r.text()).then(x=>nav.innerHTML=x);api('/api/admin/captains').then(d=>captain.innerHTML=d.captains.filter(x=>x.status==='active').map(x=>`<option value="${x.id}">${x.name} — ${x.phone}</option>`).join(''));async function save(e){e.preventDefault();try{await api('/api/admin/payments',{method:'POST',body:JSON.stringify({captain_id:captain.value,amount:amount.value,method:method.value,note:note.value})});alert('تم تسجيل الدفعة');amount.value='';note.value=''}catch(e){alert(e.message)}}</script></body></html>
